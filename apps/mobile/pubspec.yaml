name: mobile
description: Flutter mobile app
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.10.0
  flutter: ^3.41.0

dependencies:
  cupertino_icons: ^1.0.8
  dio: ^5.8.0
  firebase_core: ^4.4.0
  firebase_crashlytics: ^5.0.7
  firebase_messaging: ^16.2.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^18.0.1
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  flutter_secure_storage: ^10.0.0
  font_awesome_flutter: ^10.10.0
  forui: ^0.21.1
  freezed_annotation: ^3.0.0
  geolocator: ^13.0.4
  go_router: ^17.0.1
  google_maps_flutter: ^2.10.1
  google_sign_in: ^7.2.0
  image_picker: ^1.1.2
  intl: any
  jiffy: ^6.3.2
  json_annotation: ^4.9.0
  livekit_client: ^2.6.3
  permission_handler: ^11.4.0
  retrofit: ^4.5.0
  riverpod_annotation: ^4.0.2

dev_dependencies:
  build_runner: ^2.4.15
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.5
  flutter_test:
    sdk: flutter
  freezed: ^3.0.0
  json_serializable: ^6.9.4
  mocktail: ^1.0.4
  retrofit_generator: ^10.2.1
  riverpod_generator: ^4.0.3
  swagger_parser: ^1.3.0
  very_good_analysis: ^10.0.0

flutter_launcher_icons:
  # TODO: Place a 1024x1024 PNG at assets/icon/app_icon.png before running:
  # mise exec -- dart run flutter_launcher_icons
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  web:
    generate: false

flutter_native_splash:
  # TODO: Place splash images at the paths below before running:
  # mise exec -- dart run flutter_native_splash:create
  color: "#FFFFFF"
  color_dark: "#000000"
  image: assets/splash/splash.png
  image_dark: assets/splash/splash.png
  android: true
  ios: true
  android_12:
    color: "#FFFFFF"
    color_dark: "#000000"
    image: assets/splash/splash.png

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/icon/
    - assets/splash/
